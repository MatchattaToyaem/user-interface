image: atlassian/default-image:4

definitions:
  steps:
    - step: &build-push
        name: Build and Push to ACR
        services:
          - docker
        script:
          - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          - az login --service-principal
              --username $AZURE_CLIENT_ID
              --password $AZURE_CLIENT_SECRET
              --tenant $AZURE_TENANT_ID

          # Fetch MSAL config from Key Vault
          - VITE_AZURE_CLIENT_ID=$(az keyvault secret show --vault-name $AZURE_KEY_VAULT_NAME --name azure-client-id --query value -o tsv)
          - VITE_AZURE_AUTHORITY=$(az keyvault secret show --vault-name $AZURE_KEY_VAULT_NAME --name azure-authority --query value -o tsv)
          - VITE_AZURE_REDIRECT_URI=$(az keyvault secret show --vault-name $AZURE_KEY_VAULT_NAME --name azure-redirect-uri --query value -o tsv)
          - VITE_AZURE_SCOPE=$(az keyvault secret show --vault-name $AZURE_KEY_VAULT_NAME --name azure-scope --query value -o tsv)

          - echo $ACR_PASSWORD | docker login oconnoraiplatform.azurecr.io
              --username $ACR_USERNAME
              --password-stdin
          - docker build
              --build-arg VITE_AZURE_CLIENT_ID=$VITE_AZURE_CLIENT_ID
              --build-arg VITE_AZURE_AUTHORITY=$VITE_AZURE_AUTHORITY
              --build-arg VITE_AZURE_REDIRECT_URI=$VITE_AZURE_REDIRECT_URI
              --build-arg VITE_AZURE_SCOPE=$VITE_AZURE_SCOPE
              --build-arg VITE_AUTH_SERVICE_URL=$VITE_AUTH_SERVICE_URL
              --build-arg VITE_CHAT_SERVICE_URL=$VITE_CHAT_SERVICE_URL
              --build-arg VITE_DOCUMENT_SERVICE_URL=$VITE_DOCUMENT_SERVICE_URL
              -t oconnoraiplatform.azurecr.io/user-interface:$BITBUCKET_COMMIT .
          - docker tag oconnoraiplatform.azurecr.io/user-interface:$BITBUCKET_COMMIT
              oconnoraiplatform.azurecr.io/user-interface:latest
          - docker push oconnoraiplatform.azurecr.io/user-interface:$BITBUCKET_COMMIT
          - docker push oconnoraiplatform.azurecr.io/user-interface:latest

    - step: &deploy
        name: Deploy to Azure Container Apps
        script:
          - curl -sL https://aka.ms/InstallAzureCLIDeb | bash
          - az login --service-principal
              --username $AZURE_CLIENT_ID
              --password $AZURE_CLIENT_SECRET
              --tenant $AZURE_TENANT_ID

          # Inject ACR secret into yaml
          - sed -i "s/PLACEHOLDER_ACR/$ACR_PASSWORD/g" user-interface.yaml

          - sed -i "s|oconnoraiplatform.azurecr.io/user-interface:latest|oconnoraiplatform.azurecr.io/user-interface:$BITBUCKET_COMMIT|g" user-interface.yaml
          - |
            if az containerapp show --name ui-interface-app --resource-group ai-platform 2>/dev/null; then
              az containerapp update \
                --name ui-interface-app \
                --resource-group ai-platform \
                --yaml user-interface.yaml
            else
              az containerapp create \
                --name ui-interface-app \
                --resource-group ai-platform \
                --yaml user-interface.yaml
            fi

pipelines:
  default:
    - step: *build-push

  branches:
    main:
      - step: *build-push
      - step: *deploy
